# Pytest configuration for OpenEval Lab

[tool:pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    performance: marks tests as performance tests
    cicd: marks tests as CI/CD related
    infrastructure: marks tests as infrastructure related
    validation: marks tests as validation related
    cli: marks tests as CLI related
    unit: marks tests as unit tests
    smoke: marks tests as smoke tests
    security: marks tests as security related
    network: marks tests that require network access
    external: marks tests that require external services

# Output options - Enhanced for 2025 CI/CD with granular reporting
addopts = 
    --strict-markers
    --strict-config
    --verbose
    --tb=long
    --maxfail=5
    --color=yes
    --durations=20
    --durations-min=0.1
    --showlocals
    --capture=no
    --failed-first
    --cov=src/openeval
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=85
    --junitxml=test-results.xml
    --benchmark-json=benchmark-results.json

# Minimum version
minversion = 6.0

# Coverage options (if pytest-cov is installed)
# Uncomment to enable coverage reporting
# addopts = --cov=src/openeval --cov-report=html --cov-report=term-missing --cov-fail-under=80

# Test timeout (if pytest-timeout is installed)
timeout = 300
timeout_method = thread

# Logging - Enhanced for detailed CI/CD reporting
log_cli = true
log_cli_level = DEBUG
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s (%(filename)s:%(lineno)d): %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
log_file = pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Parallel execution (if pytest-xdist is installed)
# Uncomment to enable parallel test execution
# addopts = -n auto

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::FutureWarning:typer.*
    ignore::UserWarning:typer.*
