name: ci

on:
  push:
    branches: [ main, feat/enhanced-logging-debugging ]
  pull_request:
    branches: [ main, feat/enhanced-logging-debugging ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.10', '3.11', '3.12' ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Lint
        run: |
          ruff check .
          black --check .
      - name: Test
        run: |
          pytest -q --cov-report xml --cov=.
      - name: Validate example specs
        run: |
          python scripts/validate_examples.py
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  performance-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Performance Test
        run: |
          python -c "
          from openeval.core import evaluate
          from openeval.tasks.qa import QATask
          from openeval.adapters.echo import EchoAdapter
          from openeval.datasets.jsonl import JSONLDataset
          from openeval.metrics.exact_match import ExactMatchMetric
          import time

          # Simple performance benchmark
          start_time = time.time()
          task = QATask()
          dataset = JSONLDataset('examples/qa_toy.jsonl')
          adapter = EchoAdapter()
          metrics = [ExactMatchMetric()]

          results = evaluate(task, adapter, list(dataset), metrics)
          end_time = time.time()

          print(f'Performance test completed in {end_time - start_time:.2f}s')
          print(f'Results: {results}')
          "

  documentation-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Documentation
        run: |
          pip install linkchecker
          # Check for broken links in README
          linkchecker --check-extern --no-warnings README.md || true
          # Validate markdown files
          find docs/ -name "*.md" -exec echo "Checking {}" \; -exec head -1 {} \;

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Security Scan
        run: |
          pip install bandit
          bandit -r src/ -f json -o security-report.json || true
      - name: Upload Security Report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security-report.json
          if-no-files-found: ignore

  publish-test-results:
    runs-on: ubuntu-latest
    if: success()
    needs: [test, performance-test]
    steps:
      - uses: actions/checkout@v4
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: |
            test-results/**/*.xml
          check_name: Test Results
          comment_mode: failures
          fail_on: failures
