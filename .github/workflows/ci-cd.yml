name: OpenEval CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run nightly builds at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      run_extended_tests:
        description: 'Run extended test suite'
        required: false
        default: 'false'
        type: boolean
      deploy_docs:
        description: 'Deploy documentation'
        required: false
        default: 'false'
        type: boolean

env:
  PYTHON_VERSION: '3.9'
  NODE_VERSION: '18'

jobs:
  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,lint]"

    - name: Format check with black
      run: |
        black --check --diff src/ tests/

    - name: Lint with flake8
      run: |
        flake8 src/ tests/ --max-line-length=88 --extend-ignore=E203,W503

    - name: Type check with mypy
      run: |
        mypy src/openeval/ --ignore-missing-imports

    - name: Security audit with bandit
      run: |
        bandit -r src/ -f json -o bandit-report.json

    - name: Upload security report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: security-report
        path: bandit-report.json

  test-core:
    name: Core Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,test]"

    - name: Run unit tests
      run: |
        pytest tests/ -v --cov=src/openeval --cov-report=xml --cov-report=html --junitxml=test-results.xml

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.9'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results-${{ matrix.python-version }}
        path: |
          test-results.xml
          htmlcov/

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test-core
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'test:integration')

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,test,metrics]"

    - name: Run integration tests
      env:
        INTEGRATION_TESTS: true
      run: |
        pytest tests/integration/ -v --tb=short --timeout=300

    - name: Test CLI commands
      run: |
        python -m openeval --help
        python -m openeval doctor
        python -m openeval validate-comprehensive test_spec.json --type spec

    - name: Validate all examples
      run: |
        make validate-examples

  test-performance:
    name: Performance & Benchmarks
    runs-on: ubuntu-latest
    needs: test-core
    if: github.event.inputs.run_extended_tests == 'true' || github.event_name == 'schedule'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,test,benchmarks]"

    - name: Run performance benchmarks
      run: |
        pytest tests/benchmarks/ -v --benchmark-only --benchmark-json=benchmark-results.json

    - name: Memory usage tests
      run: |
        python -m pytest tests/test_memory.py -v

    - name: Upload benchmark results
      uses: actions/upload-artifact@v3
      with:
        name: benchmark-results
        path: benchmark-results.json

  validation:
    name: Comprehensive Validation
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,test]"

    - name: Validate project structure
      run: |
        make validate-comprehensive

    - name: Validate configurations
      run: |
        make validate-configs

    - name: Check example integrity
      run: |
        python scripts/validate_examples.py

    - name: Validate documentation
      run: |
        python -c "import openeval; print('Package imports successfully')"
        python -m openeval docs

    - name: Schema validation
      run: |
        python -m openeval schema --out schema.json
        python -m openeval results-schema --out results-schema.json

    - name: Upload validation artifacts
      uses: actions/upload-artifact@v3
      with:
        name: validation-artifacts
        path: |
          schema.json
          results-schema.json
          validation_results.json

  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
    - uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Dependency check
      run: |
        pip install safety
        safety check --json --output safety-report.json || true

    - name: Upload security artifacts
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: security-artifacts
        path: |
          trivy-results.sarif
          safety-report.json

  documentation:
    name: Documentation Build & Deploy
    runs-on: ubuntu-latest
    needs: [test-core, validation]
    if: github.ref == 'refs/heads/main' || github.event.inputs.deploy_docs == 'true'

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for proper versioning

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,docs]"

    - name: Build documentation
      run: |
        make docs

    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs/_build/html
        cname: openeval.readthedocs.io

  release:
    name: Release Management
    runs-on: ubuntu-latest
    needs: [test-core, test-integration, validation, security]
    if: github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip-release]')

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Check if version changed
      id: version_check
      run: |
        python setup.py --version > current_version.txt
        git show HEAD~1:setup.py 2>/dev/null | python - --version > previous_version.txt || echo "0.0.0" > previous_version.txt
        if ! cmp -s current_version.txt previous_version.txt; then
          echo "version_changed=true" >> $GITHUB_OUTPUT
          echo "new_version=$(cat current_version.txt)" >> $GITHUB_OUTPUT
        else
          echo "version_changed=false" >> $GITHUB_OUTPUT
        fi

    - name: Build package
      if: steps.version_check.outputs.version_changed == 'true'
      run: |
        python -m build

    - name: Create GitHub Release
      if: steps.version_check.outputs.version_changed == 'true'
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ steps.version_check.outputs.new_version }}
        release_name: Release v${{ steps.version_check.outputs.new_version }}
        draft: false
        prerelease: false

    - name: Publish to TestPyPI
      if: steps.version_check.outputs.version_changed == 'true'
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
      run: |
        twine upload --repository testpypi dist/*

    - name: Publish to PyPI
      if: steps.version_check.outputs.version_changed == 'true' && !contains(steps.version_check.outputs.new_version, 'dev')
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        twine upload dist/*

  notification:
    name: Notification & Reporting
    runs-on: ubuntu-latest
    needs: [test-core, test-integration, validation, security, documentation]
    if: always()

    steps:
    - name: Collect job status
      id: job_status
      run: |
        echo "test_core=${{ needs.test-core.result }}" >> $GITHUB_OUTPUT
        echo "test_integration=${{ needs.test-integration.result }}" >> $GITHUB_OUTPUT
        echo "validation=${{ needs.validation.result }}" >> $GITHUB_OUTPUT
        echo "security=${{ needs.security.result }}" >> $GITHUB_OUTPUT
        echo "documentation=${{ needs.documentation.result }}" >> $GITHUB_OUTPUT

    - name: Create status badge
      run: |
        if [[ "${{ needs.test-core.result }}" == "success" && "${{ needs.validation.result }}" == "success" ]]; then
          echo "BUILD_STATUS=passing" >> $GITHUB_ENV
          echo "BUILD_COLOR=brightgreen" >> $GITHUB_ENV
        else
          echo "BUILD_STATUS=failing" >> $GITHUB_ENV
          echo "BUILD_COLOR=red" >> $GITHUB_ENV
        fi

    - name: Update README badge (if main branch)
      if: github.ref == 'refs/heads/main'
      run: |
        echo "Build Status: ${{ env.BUILD_STATUS }}"
        # Badge update logic would go here

    - name: Send Slack notification (optional)
      if: failure() && github.ref == 'refs/heads/main'
      env:
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      run: |
        if [[ -n "$SLACK_WEBHOOK" ]]; then
          curl -X POST -H 'Content-type: application/json' \
            --data '{"text":"🚨 OpenEval CI/CD Pipeline Failed on main branch"}' \
            $SLACK_WEBHOOK
        fi
