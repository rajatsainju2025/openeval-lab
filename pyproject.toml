[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openeval-lab"
version = "0.0.1"
description = "Extensible, reproducible evaluation framework for LLMs and agents."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  { name = "Your Name", email = "you@example.com" },
]
# Updated dependencies for 2025 compatibility
dependencies = [
  "typer>=0.15",
  "pydantic>=2.10",
  "rich>=14.0",
  "uvicorn>=0.32",
  "fastapi>=0.115",
  "jinja2>=3.2",
  "httpx>=0.28",
  "numpy>=2.0",
  "pandas>=3.0",
  "orjson>=3.11",
  "pyyaml>=6.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0",
  "pytest-cov>=6.0",
  "pre-commit>=4.0",
  "ruff>=0.8.0",
  "black>=25.0",
]
openai = [
  "openai>=1.40.0",
]
hf = [
  "datasets>=3.0.0",
]
metrics = [
  "sacrebleu>=2.4.0",
  "bert-score>=0.3.13",
  "rouge-score>=0.1.2",
]

[project.urls]
Homepage = "https://github.com/rajatsainju2025/openeval-lab"
Repository = "https://github.com/rajatsainju2025/openeval-lab"

[project.scripts]
openeval = "openeval.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
