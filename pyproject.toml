[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openeval-lab"
version = "0.1.0"
description = "Enterprise-grade, extensible evaluation framework for LLMs and AI agents"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "OpenEval Lab Team", email = "team@openeval-lab.org"}
]
keywords = [
    "machine-learning",
    "evaluation",
    "llm",
    "nlp",
    "deep-learning",
    "artificial-intelligence",
    "benchmarking",
    "enterprise"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Benchmark"
]

dependencies = [
    "typer>=0.15.0",
    "rich>=13.7.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.10.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "orjson>=3.11.0",
    "pyyaml>=6.0.0",
    "httpx>=0.28.0",
    "jinja2>=3.1.0",
    "psutil>=6.0.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "cryptography>=42.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-benchmark>=4.0.0",
    "black>=25.0.0",
    "isort>=5.13.0",
    "mypy>=1.11.0",
    "pre-commit>=4.0.0",
    "ruff>=0.8.0",
    "coverage[toml]>=7.4.0"
]

security = [
    "hvac>=2.3.0",
    "boto3>=1.35.0",
    "azure-keyvault-secrets>=4.8.0",
    "google-cloud-secret-manager>=2.20.0",
    "keyring>=25.0.0"
]

observability = [
    "structlog>=24.0.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "prometheus-client>=0.21.0"
]

performance = [
    "memory-profiler>=0.61.0",
    "line-profiler>=4.1.3",
    "py-spy>=0.3.15"
]

marketplace = [
    "requests>=2.32.0",
    "GitPython>=3.1.43",
    "packaging>=24.0",
    "jsonschema>=4.23.0"
]

[project.urls]
Homepage = "https://github.com/openeval-lab/openeval-lab"
Repository = "https://github.com/openeval-lab/openeval-lab.git"
Issues = "https://github.com/openeval-lab/openeval-lab/issues"

[project.scripts]
openeval = "openeval.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 100
known_first_party = ["openeval"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
minversion = "9.0"
addopts = ["-ra", "--cov=openeval", "--cov-report=xml"]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "enterprise: marks tests for enterprise features"
]
