[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openeval-lab"
version = "0.0.1"
description = "Extensible, reproducible evaluation framework for LLMs and agents."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  { name = "OpenEval Lab Team", email = "team@openeval-lab.org" },
]
keywords = ["machine-learning", "evaluation", "llm", "nlp", "deep-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/openeval-lab/openeval-lab"
Documentation = "https://openeval-lab.readthedocs.io/"
Repository = "https://github.com/openeval-lab/openeval-lab.git"
Issues = "https://github.com/openeval-lab/openeval-lab/issues"
# Updated dependencies for 2025 compatibility
dependencies = [
  "typer>=0.15",
  "pydantic>=2.10",
  "rich>=14.0",
  "uvicorn>=0.32",
  "fastapi>=0.115",
  "jinja2>=3.2",
  "httpx>=0.28",
  "numpy>=2.0",
  "pandas>=3.0",
  "orjson>=3.11",
  "pyyaml>=6.1",
  "psutil>=6.0",
  "scikit-learn>=1.0.0",
  "scipy>=1.10.0",
  "cryptography>=3.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0",
  "pytest-cov>=6.0",
  "pytest-asyncio>=0.23",
  "black>=24.0",
  "isort>=5.13",
  "mypy>=1.11",
  "pre-commit>=4.0",
  "ruff>=0.6",
]
security = [
  "hvac>=1.0.0",
  "boto3>=1.26.0",
  "azure-keyvault-secrets>=4.5.0",
  "google-cloud-secret-manager>=2.16.0",
]
  "pytest-asyncio>=0.23.0",
  "pytest-benchmark>=4.0.0",
  "pre-commit>=4.0",
  "ruff>=0.8.0",
  "black>=25.0",
  "mypy>=1.8.0",
  "isort>=5.13.0",
  "coverage>=7.4",
  "sphinx>=7.0",
  "sphinx-rtd-theme>=2.0",
  "tox>=4.11",
  "bump2version>=1.0",
]

[project.scripts]
openeval = "openeval.cli:main"

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.ruff]
line-length = 88
target-version = "py39"
select = ["E", "F", "B", "C", "N", "D", "W", "I"]
ignore = ["D107", "D203", "D212", "D100"]

[tool.ruff.per-file-ignores]
"tests/*" = ["D", "N", "S"]
"docs/*" = ["D"]

[tool.ruff.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "-ra -q --cov=openeval --cov-report=xml --cov-report=term-missing"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
]
openai = [
  "openai>=1.40.0",
]
hf = [
  "datasets>=3.0.0",
]
metrics = [
  "sacrebleu>=2.4.0",
  "bert-score>=0.3.13",
  "rouge-score>=0.1.2",
]

[project.urls]
Homepage = "https://github.com/rajatsainju2025/openeval-lab"
Repository = "https://github.com/rajatsainju2025/openeval-lab"

[project.scripts]
openeval = "openeval.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
